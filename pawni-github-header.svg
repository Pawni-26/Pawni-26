<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B18"/>
      <stop offset="0.5" stop-color="#11152B"/>
      <stop offset="1" stop-color="#090B1A"/>
    </linearGradient>
    <linearGradient id="title" x1="350" y1="120" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="line" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#A78BFA"/>
      <stop offset="0.75" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="344" rx="28" fill="url(#bg)" stroke="#3B2A68" stroke-width="2"/>

  <!-- stars -->
  <g fill="#C4B5FD">
    <circle cx="80" cy="72" r="2.5"/><circle cx="170" cy="125" r="1.8"/>
    <circle cx="1010" cy="70" r="2.2"/><circle cx="1090" cy="145" r="1.7"/>
    <circle cx="930" cy="285" r="2"/><circle cx="250" cy="285" r="1.7"/>
  </g>
  <g fill="#60A5FA">
    <circle cx="120" cy="230" r="1.8"/><circle cx="1050" cy="235" r="2"/>
    <circle cx="320" cy="60" r="1.6"/><circle cx="850" cy="55" r="1.7"/>
  </g>

  <!-- decorative circuit/brain -->
  <g opacity="0.8" stroke="#8B5CF6" stroke-width="2">
    <path d="M1015 110h45v-22h42"/>
    <path d="M1030 140h65v25h35"/>
    <path d="M1018 175h45v30h50"/>
    <path d="M1010 210h38v28h55"/>
  </g>
  <g fill="#60A5FA" filter="url(#glow)">
    <circle cx="1102" cy="88" r="4"/><circle cx="1130" cy="165" r="4"/>
    <circle cx="1113" cy="238" r="4"/><circle cx="1060" cy="205" r="4"/>
  </g>

  <!-- laptop/code icon -->
  <g transform="translate(82 132)">
    <rect x="0" y="0" width="150" height="96" rx="10" stroke="#8B5CF6" stroke-width="3" fill="#0B1020"/>
    <path d="M-12 112h174l-18 18H6l-18-18Z" fill="#151A34" stroke="#60A5FA" stroke-width="2"/>
    <text x="75" y="59" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="28" font-weight="700">&lt;/&gt;</text>
  </g>

  <!-- main title -->
  <text x="600" y="78" text-anchor="middle" fill="#C4B5FD" font-family="sans-serif" font-size="20" letter-spacing="7">HELLO, I'M</text>
  <text x="600" y="172" text-anchor="middle" fill="url(#title)" font-family="sans-serif" font-size="70" font-weight="800" letter-spacing="4">PAWNI GOEL</text>
  <text x="600" y="216" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="18" letter-spacing="3">COMPUTER SCIENCE  •  AI &amp; ML  •  SOFTWARE DEVELOPMENT</text>

  <rect x="330" y="245" width="540" height="2" rx="1" fill="url(#line)"/>
  <text x="600" y="282" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="17">&lt; Building intelligent solutions with code /&gt;</text>

  <!-- sparkles -->
  <g fill="#C4B5FD">
    <path d="M286 101l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10Z"/>
    <path d="M900 104l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8Z"/>
  </g>
</svg>
